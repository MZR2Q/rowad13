<!-- Modal for Viewing Detailed Student Quiz Answers (استعراض إجابات الطالب بالتفصيل) -->
<div id="studentAnswersModal" class="modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center; padding:16px;">
  <div style="background:#fff; width:100%; max-width:850px; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.35); overflow:hidden; animation:slideUp 0.3s ease; display:flex; flex-direction:column; max-height:90vh;">
    <!-- Modal Header -->
    <div style="background:var(--sb-bg); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
      <div>
        <h3 id="saModalTitle" style="font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-graduation-cap" style="color:var(--c3);"></i> تفاصيل إجابات الطالب
        </h3>
        <p id="saModalSubtitle" style="font-size:0.8rem; color:rgba(255,255,255,0.7); margin-top:2px;">استعراض الأسئلة والإجابات المختارة والدرجة بالتفصيل</p>
      </div>
      <button onclick="closeStudentAnswersModal()" style="color:rgba(255,255,255,0.7); font-size:1.3rem; background:none; border:none; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Student Info Bar -->
    <div id="saStudentInfoBar" style="background:#f8fafc; border-bottom:1px solid #e2e8f0; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; flex-shrink:0;">
      <!-- Populated dynamically -->
    </div>

    <!-- Questions Answered List -->
    <div id="saQuestionsList" style="padding:20px 24px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px;">
      <!-- Populated dynamically -->
    </div>

    <!-- Modal Footer -->
    <div style="padding:14px 24px; background:#f8fafc; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
      <span id="saSummaryFooter" style="font-size:0.85rem; color:var(--ink-600); font-weight:700;"></span>
      <button type="button" class="btn-outline" onclick="closeStudentAnswersModal()" style="padding:8px 18px; font-size:0.85rem;">إغلاق النافذة</button>
    </div>
  </div>
</div>
