<!-- ─── ALL QUESTIONS BANK MODAL (نافذة بنك الأسئلة الشاملة والمصنفة) ─── -->
<div id="allQuestionsBankModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.65); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center; padding:16px;">
  <div style="background:#fff; width:100%; max-width:960px; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.35); overflow:hidden; display:flex; flex-direction:column; max-height:90vh; border-top:6px solid var(--c1);">
    
    <!-- Modal Header -->
    <div style="background:var(--sb-bg); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:1.15rem; font-weight:800; color:#fff; display:flex; align-items:center; gap:10px; margin:0;">
        <i class="fa-solid fa-boxes-stacked" style="color:var(--c3);"></i> 📚 بنك الأسئلة الشامل والمصنف (<span id="modal-bank-q-count">22</span> سؤالاً)
      </h3>
      <button type="button" onclick="closeAllQuestionsBankModal()" style="background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer; opacity:0.8; transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">&times;</button>
    </div>

    <div style="padding:20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; background:#f8fafc;">
      
      <!-- Filter & Search Bar -->
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; background:#fff; padding:14px; border-radius:14px; border:1px solid #e2e8f0; box-shadow:var(--sh-xs);">
        <div style="flex:2; min-width:240px;">
          <input type="text" id="bankSearchInput" oninput="filterGlobalBankQuestions()" placeholder="🔍 ابحث في نص السؤال، الكلمات الدلالية أو المادة..." style="width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--ink-300); font-size:0.88rem; font-family:inherit;">
        </div>

        <div style="flex:1; min-width:200px;">
          <select id="bankCategoryFilter" onchange="filterGlobalBankQuestions()" style="width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--ink-300); font-size:0.88rem; font-family:inherit; font-weight:700; color:var(--ink-800);">
            <option value="all">🔍 جميع الأقسام والتصنيفات</option>
          </select>
        </div>

        <button type="button" onclick="openAddQuestionModal()" class="btn-primary" style="font-size:0.85rem; padding:10px 16px; background:linear-gradient(135deg, var(--c1), var(--c2));">
          <i class="fa-solid fa-plus-circle"></i> إضافة سؤال جديد ➕
        </button>
      </div>

      <!-- Questions List Container -->
      <div id="global-bank-questions-list" style="display:flex; flex-direction:column; gap:12px;">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Modal Footer -->
    <div style="background:#fff; border-top:1px solid var(--ink-200); padding:14px 24px; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:0.8rem; color:var(--ink-500);"><i class="fa-solid fa-shield-halved" style="color:var(--c1);"></i> تصنيف معتمد ومربوط ديناميكياً بالأقسام</div>
      <button type="button" onclick="closeAllQuestionsBankModal()" class="btn-outline">إغلاق بنك الأسئلة</button>
    </div>
  </div>
</div>
